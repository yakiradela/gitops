name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Get Image Tag (Commit SHA)
        id: image_tag
        run: |
          TAG="sha-${{ github.sha }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Update image tag in Kubernetes Deployment manifest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # עדכון התגית בקובץ manifests/deployment.yaml אוטומטית
          sed -i 's|image: ghcr.io/.*|image: ghcr.io/${{ github.repository }}:${{ steps.image_tag.outputs.TAG }}|g' manifests/deployment.yaml

          git add manifests/deployment.yaml
          git commit -m "CI: Update image tag to ${{ steps.image_tag.outputs.TAG }}"
          git push origin main
